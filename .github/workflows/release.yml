name: Build e Release APK

on:
  push:
    branches:
      - 'claude/**'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão (ex.: 0.1). Sem esse valor, usa o arquivo VERSION.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Definir versão
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            V="${{ github.event.inputs.version }}"
          elif [ -f VERSION ]; then
            V="$(tr -d ' \t\n\r' < VERSION)"
          else
            V="0.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "versionCode=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Versão: $V (code ${GITHUB_RUN_NUMBER})"

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Restaurar keystore dos Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "Keystore restaurada — APK sairá assinado de release."
          else
            echo "AVISO: Secret KEYSTORE_BASE64 ausente — o APK sairá assinado em debug."
          fi

      - name: Build do APK de release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease \
            -PappVersionName=${{ steps.ver.outputs.version }} \
            -PappVersionCode=${{ steps.ver.outputs.versionCode }}

      - name: Renomear APK
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n1)
          cp "$APK" "HoraAHora-TunelFAI-v${{ steps.ver.outputs.version }}.apk"
          ls -la *.apk

      - name: Publicar Release com o APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Hora a Hora Túnel FAI ${{ steps.ver.outputs.version }}
          files: HoraAHora-TunelFAI-v${{ steps.ver.outputs.version }}.apk
          generate_release_notes: true
